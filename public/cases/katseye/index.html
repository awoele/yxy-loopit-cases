  <link rel="preload" href="./loopit-project-metadata.json" as="fetch" crossorigin>
<script>
  (function bootstrap() {
    if ("external" !== "external") return;

    const FALLBACK_RUNTIME_URL = "https://cdn-cf.loopit.me/loopit/hot-update/baseline/0.6.0-af9bc75ba54b/loopit-runtime.baseline.global.js";
    const DEFAULT_CHANNEL = "stable" || "stable";
    const SCHEMA_VERSION_MAX = 1;
    const LKG_VERSION = 2;
    const LKG_TTL_MS = 7 * 24 * 3600 * 1000;

    let lkgKey = null;
    // Cache metadata for emergency fallback path: when start() fails after
    // fetching meta (e.g. manifest 404 / runtime SRI mismatch), the outer
    // catch needs `meta.entry` to call loadEntry(meta) after the fallback
    // runtime injects — otherwise external mode renders a blank page (vite
    // strips the original index.html entry script for external builds).
    let cachedMeta = null;
    const vendorAndRuntimeSpecs = [];

    const safe = (s) => String(s == null ? "" : s).replace(/[<>&]/g, "");

    const showFallback = (msg, detail) => {
      const root = document.getElementById("root") || document.body;
      root.innerHTML =
        `<div><h1>${safe(msg || "Loading failed")}</h1>` +
        (detail ? `<p>${safe(detail)}</p>` : "") +
        `</div>`;
    };

    const injectScript = (spec, trackForLKG) => new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = spec.url;
      if (spec.integrity) s.integrity = spec.integrity;
      s.crossOrigin = "anonymous";
      // Insertion order: __vendor_FramerMotion depends on __vendor_React.
      s.async = false;
      s.onload = () => {
        if (trackForLKG) {
          vendorAndRuntimeSpecs.push({ kind: "script", url: spec.url, integrity: spec.integrity || null });
        }
        resolve();
      };
      s.onerror = () => reject(new Error(`script load failed: ${spec.url}`));
      document.head.appendChild(s);
    });

    const injectStylesheet = (spec) => new Promise((resolve, reject) => {
      const l = document.createElement("link");
      l.rel = "stylesheet";
      l.href = spec.href;
      if (spec.integrity) l.integrity = spec.integrity;
      l.crossOrigin = "anonymous";
      l.onload = () => resolve();
      l.onerror = () => reject(new Error(`stylesheet load failed: ${spec.href}`));
      document.head.appendChild(l);
    });

    const fetchJson = (url) => fetch(url).then((r) => {
      if (!r.ok) throw new Error(`HTTP ${r.status} ${url}`);
      return r.json();
    });

    // Channel name allowlist — matches the regex enforced by promote-sdk.mjs
    // and publish-manifest.mjs (VALID_CHANNEL: /^[a-zA-Z0-9_-]{1,64}$/). Used
    // to validate the ?runtimeChannel debug override (also implicitly rejects
    // "__proto__" / "constructor" / etc. prototype-member names).
    const CHANNEL_NAME_RE = /^[a-zA-Z0-9_-]{1,64}$/;

    // ?runtimeChannel=X override — honored only for loopit_debug=1 visitors.
    // v7 — returns the override string (or null if none/not authorized/invalid).
    // Charset+length validation prevents (a) prototype-name keys from reaching
    // channels{} lookup, (b) megabyte payloads bloating later error messages.
    const resolveDebugChannel = (search) => {
      const q = search.get("runtimeChannel");
      if (!q || !CHANNEL_NAME_RE.test(q)) return null;
      let isDebug = false;
      try { isDebug = /(?:^|;\s*)loopit_debug=1(?:;|$)/.test(document.cookie || ""); }
      catch (e) { /* document.cookie may throw in sandbox; treat as not-debug */ }
      return isDebug ? q : null;
    };

    // resolve a unified manifest down to a single version entry with a
    // flat vendor map.
    //
    // Channel pick priority: debug override > meta.manifestChannel >
    // unified.default. Uses Object.prototype.hasOwnProperty to gate channel /
    // version / vendor lookups so prototype member names (__proto__ /
    // constructor / toString / valueOf / ...) can never resolve to inherited
    // Object methods and silently shadow real channels.
    //
    // v2 vendor pack: top-level `raw.vendor` is an append-only map keyed by
    // `<name>@<version>` (e.g. "react-stack@1.0.0"). versions[v].vendor is an
    // array of those keys. This function resolves each key back to its {url,
    // integrity} entry and returns a bare-name → entry map that applyManifest
    // can consume verbatim (applyManifest doesn't care about versioning).
    const hasOwn = Object.prototype.hasOwnProperty;
    const resolveUnifiedEntry = (raw, baselineChannel, debugChannel) => {
      const channels = raw.channels || {};
      const versions = raw.versions || {};
      const vendorPack = raw.vendor || {};
      const candidates = [];
      if (debugChannel) candidates.push(debugChannel);
      if (baselineChannel) candidates.push(baselineChannel);
      if (raw.default && candidates.indexOf(raw.default) === -1) candidates.push(raw.default);
      let v = null;
      let usedChannel = null;
      for (let i = 0; i < candidates.length; i++) {
        const k = candidates[i];
        if (typeof k === "string" && hasOwn.call(channels, k) && typeof channels[k] === "string") {
          v = channels[k];
          usedChannel = k;
          break;
        }
      }
      if (!v) {
        throw new Error(
          "unified manifest: no channel match (tried [" + candidates.join(",") +
          "]; available=[" + Object.keys(channels).join(",") + "])"
        );
      }
      if (!hasOwn.call(versions, v)) {
        throw new Error(
          "unified manifest: version " + String(v) + " not present in versions{} (channel=" + usedChannel + ")"
        );
      }
      const versionEntry = versions[v];
      // Resolve vendor refs (v2 string array) → bare-name → {url, integrity} map.
      const vendorRefs = Array.isArray(versionEntry.vendor) ? versionEntry.vendor : [];
      const vendorMap = {};
      for (let j = 0; j < vendorRefs.length; j++) {
        const ref = vendorRefs[j];
        if (typeof ref !== "string") continue;
        if (!hasOwn.call(vendorPack, ref)) {
          throw new Error(
            "unified manifest: vendor pack missing ref \"" + ref + "\" referenced by version " + String(v)
          );
        }
        // Strip @version suffix → bare name (applyManifest's vendor map shape).
        vendorMap[String(ref).replace(/@[^@]+$/, "")] = vendorPack[ref];
      }
      const flatEntry = {
        runtime: versionEntry.runtime,
        vendor: vendorMap,
      };
      // scene3d (OPTIONAL): a separate 3D-scene hot-update IIFE pinned inline
      // per version (sibling of runtime). Only present for versions that ship
      // 3D; applyManifest injects it after runtime when the game requires it.
      if (versionEntry.scene3d) flatEntry.scene3d = versionEntry.scene3d;
      return { entry: flatEntry, channel: usedChannel, version: v };
    };

    const saveLKG = (projectId, contract, specs) => {
      if (!projectId || !contract || !specs || !specs.length) return;
      try {
        window.localStorage.setItem(`loopit:lkg:${projectId}`, JSON.stringify({
          schemaVersion: LKG_VERSION,
          contract: contract,
          specs: specs,
          expiresAt: Date.now() + LKG_TTL_MS,
        }));
      } catch (e) { /* quota; ignore */ }
    };

    const readLKG = (projectId, contract) => {
      try {
        const raw = window.localStorage.getItem(`loopit:lkg:${projectId}`);
        if (!raw) return null;
        const p = JSON.parse(raw);
        if (p.schemaVersion !== LKG_VERSION) return null;
        if (p.contract !== contract) return null;
        if (typeof p.expiresAt === "number" && p.expiresAt < Date.now()) return null;
        if (!Array.isArray(p.specs) || !p.specs.length) return null;
        return p;
      } catch (e) { return null; }
    };

    // applyManifest expects a "flat" entry: { runtime, vendor: { bareName: {url, integrity} } }.
    // - In unified path, resolveUnifiedEntry projects the vendor pack into
    //   this shape (versions[v].vendor refs → bare-name map).
    // - In legacy v6 path (stable.json / CN phase-1), the response IS the flat manifest.
    //
    // `requiredVendors` filter (Option F vendor selectivity): when meta carries
    // a non-empty `requiredVendors: string[]`, only inject vendor entries whose
    // bare name is in the set. Lets 2D projects skip the ~5MB three-stack +
    // rapier bundles (vite plugin computes this from `'three' in package.json
    // dependencies` — same source-of-truth as embedded mode injectVendorScripts).
    // Missing / empty `requiredVendors` → load all vendors in manifest (old
    // metadata.json compat).
    const applyManifest = (manifest, requiredVendors, requiresScene3d) => {
      if (manifest.schemaVersion > SCHEMA_VERSION_MAX) {
        return Promise.reject(new Error(`manifest schemaVersion ${manifest.schemaVersion} not supported`));
      }
      let vendorKeys = manifest.vendor ? Object.keys(manifest.vendor) : [];
      if (Array.isArray(requiredVendors) && requiredVendors.length > 0) {
        const requiredSet = {};
        for (let i = 0; i < requiredVendors.length; i++) {
          const n = requiredVendors[i];
          if (typeof n === "string") requiredSet[n] = true;
        }
        vendorKeys = vendorKeys.filter((k) => hasOwn.call(requiredSet, k));
      }
      const vendors = vendorKeys.map((k) => injectScript(manifest.vendor[k], true));
      return Promise.all(vendors)
        .then(() => injectScript(manifest.runtime, true))
        .then(() => {
          // scene3d is a separate hot-update IIFE loaded ONLY for 3D games
          // (requiresScene3d, set by the vite plugin when the bundle externalizes
          // @seedleap/loopit-runtime/scene3d). It depends on the three-stack
          // vendor + the runtime global, both injected above, and attaches to
          // window.__LoopitRuntime__.subpaths.scene3d. Tracked for LKG so the
          // fallback replay re-loads it. 2D games skip it (no manifest.scene3d
          // or requiresScene3d=false). If a 3D game's manifest lacks scene3d
          // (mis-ordered rollout: vite shipped before the manifest pin), we let
          // the game's own scene3d import surface the error rather than masking
          // it — the emergency baseline can't provide scene3d anyway.
          if (requiresScene3d && manifest.scene3d && manifest.scene3d.url) {
            return injectScript(manifest.scene3d, true);
          }
        });
    };

    // Sequential apply for LKG specs (script/stylesheet) with SRI re-verification.
    const applySpecs = (specs) => specs.reduce(
      (seq, s) => seq.then(() => s.kind === "stylesheet"
        ? injectStylesheet({ href: s.href, integrity: s.integrity })
        : injectScript({ url: s.url, integrity: s.integrity }, false)),
      Promise.resolve(),
    );

    // Loaded runtime must implement the API level the bundle was built for.
    const verifyRuntime = (meta) => {
      if (!window.__LoopitRuntime__) {
        throw new Error("runtime loaded but __LoopitRuntime__ not attached");
      }
      const rt = window.__LoopitRuntime__;
      const implemented = rt.implementsAPILevels || [];
      if (meta.runtimeAPILevel != null && implemented.indexOf(meta.runtimeAPILevel) === -1) {
        throw new Error(
          `runtime ${rt.version} does not implement API Level ${meta.runtimeAPILevel} ` +
          `(implements: [${implemented.join(",")}])`
        );
      }
      // Stamp the actually-loaded runtime version into __ENV__ so telemetry
      // distinguishes the authoring-time baseline (runtime_version, written
      // by vite from package.json) from what bootstrap really got from the
      // manifest. Without this, observability reports "this session ran
      // 0.6.0" when the project bundle was authored against 0.6.0 but the
      // CDN manifest actually served 0.6.1 (hot-update happy path).
      if (typeof window !== "undefined") {
        const env = window.__ENV__ || {};
        env.runtime_actual_version = rt.version || null;
        // scene3d ships as a separate hot-update IIFE; stamp its actually-loaded
        // version too (parallel to runtime_actual_version) so telemetry can tell
        // whether a 3D game's scene3d fix reached the session. Null for 2D games
        // (scene3d not loaded) — distinguishable from a load failure by whether
        // the game required it.
        env.scene3d_actual_version =
          (window.__LoopitScene3D__ && window.__LoopitScene3D__.version) || null;
        window.__ENV__ = env;
      }
    };

    // Project CSS + entry. Bundle-local — never go through manifest, always sibling.
    const loadEntry = (meta) => {
      const cssLoads = (meta.entry && meta.entry.css)
        ? meta.entry.css.map((c) => injectStylesheet(c))
        : [];
      return Promise.all(cssLoads).then(
        () => injectScript({ url: meta.entry.js, integrity: meta.entry.integrity }, false)
      );
    };

    // checkManifestLevel applies to legacy v6 manifests only (stable.json mirror,
    // or projects scaffolded against an older stable.json URL). Unified manifest
    // conveys api-level via `apiLevel` field + URL path; entries don't carry
    // their own implementsAPILevels.
    const checkManifestLevel = (manifest, projectLevel) => {
      const levels = Array.isArray(manifest.implementsAPILevels)
        ? manifest.implementsAPILevels
        : (typeof manifest.runtimeAPILevel === "number" ? [manifest.runtimeAPILevel] : []);
      if (projectLevel != null && levels.length > 0 && levels.indexOf(projectLevel) === -1) {
        throw new Error(`API Level mismatch: project=${projectLevel}, manifest serves=${levels.join(",")}`);
      }
    };

    const start = () => fetchJson("./loopit-project-metadata.json").then((meta) => {
      cachedMeta = meta;
      lkgKey = meta.projectId || "default";
      if (!meta.manifestUrl) {
        throw new Error("loopit-project-metadata.json missing manifestUrl");
      }
      const debugChannel = resolveDebugChannel(new URLSearchParams(window.location.search));
      // v7 — manifest URL is `/api-level-N/manifest.json` (unified) for new
      // projects, OR `/api-level-N/stable.json` (legacy v6) for projects that
      // were build-time-pinned to the old per-channel URL (and for CN bootstrap
      // phase-1 — see multi-env-channels.md §3.3). Channel selection happens
      // AFTER fetch by reading the unified channels{} map; the legacy branch
      // below handles the stable.json case.

      return fetchJson(meta.manifestUrl)
        .then((raw) => {
          let manifestEntry;
          let usedChannel = null;
          let usedVersion = null;
          if (raw && raw.schema === "unified") {
            // Sanity cross-check api-level (URL path vs manifest.apiLevel).
            if (meta.runtimeAPILevel != null && raw.apiLevel != null
                && Number(raw.apiLevel) !== Number(meta.runtimeAPILevel)) {
              throw new Error(
                "API Level mismatch: project=" + meta.runtimeAPILevel +
                ", unified.apiLevel=" + raw.apiLevel
              );
            }
            // Detect un-substituted placeholder (older scaffold or build without
            // vite plugin running) — fall back to DEFAULT_CHANNEL rather than
            // looking up "__LP_MANIFEST_CHANNEL__" in channels{} (would always
            // miss + force the unified.default fallback, but waste a lookup
            // and surface a confusing channel string in telemetry).
            const metaCh = meta.manifestChannel ? String(meta.manifestChannel) : "";
            const baseline = (metaCh && metaCh.indexOf("__LP_") !== 0)
              ? metaCh
              : DEFAULT_CHANNEL;
            const resolved = resolveUnifiedEntry(raw, baseline, debugChannel);
            manifestEntry = resolved.entry;
            usedChannel = resolved.channel;
            usedVersion = resolved.version;
          } else {
            // Legacy v6 manifest (stable.json mirror, CN phase-1, or older
            // pre-unified projects) — response IS the full manifest, no
            // channels{} map to switch between.
            //
            // `?runtimeChannel=X` debug override is intentionally NOT honored
            // here: v6 has a single embedded version per file, so there is no
            // alternative channel to switch to. The override only works in
            // unified path (above). CN phase-1 + old stable.json builds must
            // wait for CN bucket to host unified manifest before debug-channel
            // switching becomes possible. See multi-env-channels-runbook.md §4.
            checkManifestLevel(raw, meta.runtimeAPILevel);
            manifestEntry = raw;
          }
          // Stamp resolved channel/version into __ENV__ for telemetry.
          if (typeof window !== "undefined" && usedChannel) {
            const env = window.__ENV__ || {};
            env.runtime_channel_resolved = usedChannel;
            env.runtime_version_resolved = usedVersion;
            window.__ENV__ = env;
          }
          return applyManifest(manifestEntry, meta.requiredVendors, meta.requiresScene3d);
        })
        .then(() => {
          verifyRuntime(meta);
          // Save LKG before entry so an entry-side bug doesn't poison the snapshot.
          saveLKG(lkgKey, meta.runtimeAPILevel, vendorAndRuntimeSpecs.slice());
          return loadEntry(meta);
        })
        .catch((err) => {
          // LKG fallback: replay last-known-good with SRI re-verification.
          const lkg = readLKG(lkgKey, meta.runtimeAPILevel);
          if (!lkg) throw err;
          return applySpecs(lkg.specs)
            .then(() => { verifyRuntime(meta); return loadEntry(meta); })
            .catch(() => { throw err; });  // re-throw primary err for outer handler
        });
    });

    start().catch((err) => {
      // Emergency baseline (self-contained, embeds vendors). After injecting
      // the fallback runtime we MUST also load the project entry — external
      // mode strips the original entry script from index.html, so without
      // loadEntry(meta) the page would render the runtime but no game.
      const msg = err && err.message;
      if (FALLBACK_RUNTIME_URL && FALLBACK_RUNTIME_URL.indexOf("__LP_") !== 0) {
        injectScript({ url: FALLBACK_RUNTIME_URL }, false)
          .then(() => {
            if (cachedMeta) return loadEntry(cachedMeta);
            // meta fetch itself failed earlier; without entry path the page
            // would white-screen — surface the original error explicitly.
            showFallback("Could not load runtime", msg);
          })
          .catch(() => showFallback("Could not load runtime", msg));
      } else {
        showFallback("Could not load runtime", msg);
      }
    });
  })();
</script>
